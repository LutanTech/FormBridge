        <div id="alertContainer"></div>
    
        <script>
            const form = document.querySelector('#checkForm');
            // const BASE_URL = 'http://127.0.0.1:7820';
            const BASE_URL = 'https://submissionsmu.pythonanywhere.com';
    
            function showAlert(message, type = 'info') {
                const alertBox = document.createElement('div');
                alertBox.className = `custom-alert ${type}`;
                alertBox.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-times-circle' : 'fa-info-circle'} mr-2"></i> ${message}`;
                document.body.appendChild(alertBox);
                setTimeout(() => alertBox.classList.add('show'), 50);
                setTimeout(() => {
                    alertBox.classList.remove('show');
                    setTimeout(() => alertBox.remove(), 400);
                }, 4000);
            }
    
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                const adm = form.querySelector('#adm').value.trim().toUpperCase();
                const phone = form.querySelector('#phone').value.trim();
                const btn = form.querySelector('#check');
                const originalButtonText = btn.innerHTML;
    
                btn.innerHTML = '<span class="loader w-5 h-5 border-2 mr-2"></span> Getting data...';
                btn.disabled = true;
    
                if (adm || phone) {
                    fetch(`${BASE_URL}/view?adm=${adm}&phone=${phone}`)
                        .then(res => res.json())
                        .then(data => {
                            if (data.error) {
                                showAlert(data.error, 'error');
                                btn.innerHTML = originalButtonText;
                                btn.disabled = false;
                            } else {
                                const sub = data.submission;
                                if (sub) {
                                    const ovI = document.querySelector('.overlay-inner');
                                    const ov = document.querySelector('.overlay');
                                    ov.classList.add('flex-center');
                                    ov.classList.remove('none');
                                    ov.removeAttribute('style');
    
                                    ovI.innerHTML = `
                                        <h2 class="text-2xl font-bold text-center text-slate-800 mb-4">Submission Details</h2>
                                        <button id="closeOv" class="absolute top-4 right-4 text-3xl font-light text-red-500 hover:text-red-700 transition">&times;</button>
                                        <hr class="w-full border-slate-200 mb-4">
                                        <div class="dataDiv space-y-3 text-left w-full">
                                            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center p-2  rounded-lg">
                                                <b class="text-sm text-slate-700">Reference ID:</b> <span class="text-base font-mono text-indigo-600">${sub.reference_id}</span>
                                            </div>
                                            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center p-2">
                                                <b class="text-sm text-slate-700">Admission No:</b> <span class="text-base font-medium text-slate-800 uppercase">${sub.admission_number}</span>
                                            </div>
                                            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center p-2  rounded-lg">
                                                <b class="text-sm text-slate-700">Name:</b> <span class="text-base font-medium text-slate-800">${sub.name}</span>
                                            </div>
                                            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center p-2">
                                                <b class="text-sm text-slate-700">Phone:</b> <span class="text-base font-medium text-slate-800">${sub.phone_number}</span>
                                            </div>
                                            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center p-2  rounded-lg">
                                                <b class="text-sm text-slate-700">Submitted On:</b> <span class="text-sm text-slate-500">${sub.submitted_at}</span>
                                            </div>
                                        </div>
                                    `;
    
                                    document.querySelector('#closeOv').addEventListener('click', () => {
                                        ov.classList.remove('flex-center');
                                        ov.classList.add('none');
                                    });
                                }
                                btn.innerHTML = originalButtonText;
                                btn.disabled = false;
                            }
                        })
                        .catch(err => {
                            console.error(err);
                            showAlert('Network Error: Failed to reach server. Check console for details.', 'error');
                            btn.innerHTML = originalButtonText;
                            btn.disabled = false;
                        });
                } else {
                    showAlert('Please enter either Admission Number or Phone Number.', 'info');
                    btn.innerHTML = originalButtonText;
                    btn.disabled = false;
                }
            });
    
            document.addEventListener('click', (e) => {
                const ov = document.querySelector('.overlay');
                if (e.target.classList.contains('overlay')) {
                    ov.classList.remove('flex-center');
                    ov.classList.add('none');
                }
            });
        </script>
