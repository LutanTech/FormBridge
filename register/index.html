    <main class="flex-grow flex flex-col">
        <div class="form-wrapper">
            <form action="/register" onsubmit="return false" method="post">
                <div class="dat">
                <div class="logo">
                    <img src="/assets/images/logo-nbg.png" alt="">
                </div>
                <div class="name"> 
                <h2 class="3xl">Form<span style="color: rgb(173, 64, 250);">Bridge</span></h2></div>
                </div>
                <hr style="width: 100%;">
                <div class="div">
                    <label for="username">Enter Username</label>
                    <div class="div-inp">
                        <i class="fas fa-user-circle"></i>
                        <input type="text" name="username" id="username" placeholder="Username" maxLength="10" required>
                    </div>
                </div>
                <div class="div">
                    <label for="email">Enter Email</label>
                    <div class="div-inp">
                        <i class="fas fa-envelope"></i>
                        <input type="email" name="email" id="email" placeholder="Email" required>
                    </div>
                </div>
                <div class="div">
                    <label for="password">Enter Password</label>
                    <div class="div-inp">
                        <i class="fas fa-lock"></i>
                        <input type="password" name="password" id="password" placeholder="Password" required>
                    </div>
                </div>
                                <div class="div">
                    <label for="c-password">Confirm Password</label>
                    <div class="div-inp">
                        <i class="fas fa-lock-open"></i>
                        <input type="text" autocomplete="off" name="c-password" id="c-password" placeholder="Confirm Password" required>
                    </div>
                </div>
                <div class="actions" style="width: 100%;">
                    <button type="submit">Register</button>
                    <div class="reg">
                        <hr> 
                    <a href="/login" style="color: #0f0;"> Login </a>
                    <hr>
                </div>
                <a href="/" style="color: rgb(179, 0, 255);"> Home </a>
            
                </div>
            </form>
        </div>

        </main>

    <script>
        document.addEventListener('DOMContentLoaded', ()=>{

        const form = document.querySelector('form');

        form.addEventListener('submit', (e)=>{
           e.preventDefault()
           e.stopImmediatePropagation()

           const username = form.querySelector('#username').value.trim()
           const password = form.querySelector('#password').value.trim()
           const email = form.querySelector('#email').value.trim()
           const c_password = form.querySelector('#c-password').value.trim()

           if(username && password && email && c_password){
            if(password !== c_password){
                alert('Mismatch Error', 'Passwords do not match', 'error')
                return
            }
            const payload = {
            username:username,
            password:password,
            email:email
            }
            login(jof(payload))
           }

        })
        function login(payload){
            console.log(payload)
            toggleBtn(true)
            fetch(`${baseUrl}/register`, {
                headers:{
                    'Content-Type':'application/json'
                },
                 method:'POST',
                 body:JSON.stringify({data:payload})
            })
            .then(res=>res.json())
            .then(data=>{
                if(data.error){
                    alert('Failed', data.error, 'error')
                    toggleBtn(false)
                } else{
                    alert('Success',`Account created!. Please check your email for the OTP`, 'success' )
                    toggleBtn(false)
                    setTimeout(()=>{
                    window.location.href = "/verify_email"
                    }, 2000)
                }
            })
            .catch(err=>{
                alert('Network Error', 'Please Make sure you have an active internet connection', 'error')
                toggleBtn(false)
            })
        
        }
        function toggleBtn(toggle){
                const btn = form.querySelector('button')
                btn.disabled = toggle
                toggle ? btn.setAttribute('data-loading', '') : btn.removeAttribute('data-loading', '')
                if(btn.hasAttribute('data-loading')){
                 btn.innerHTML = 'Register <i class="fas fa-spinner fa-spin"></i> '
                    } else{
                        btn.innerHTML = 'Register'
                    }
        }

})
    </script>
