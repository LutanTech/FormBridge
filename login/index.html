  <script>

<body class="bg-slate-950 min-h-screen flex flex-col text-slate-200 antialiased selection:bg-indigo-500 selection:text-white overflow-x-hidden">

  <!-- Background Elements -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none -z-10">
    <div class="absolute top-0 left-1/4 w-[500px] h-[500px] bg-indigo-600/10 rounded-full blur-[100px]"></div>
    <div class="absolute bottom-0 right-1/4 w-[500px] h-[500px] bg-purple-600/10 rounded-full blur-[100px] " style="animation-delay: 2s;"></div>
  </div>

  <main class="flex-grow flex flex-col">
    <div class="otpField none">
      <form id="tfaform" action="#">
        <label for="tfa">Enter the 2FA code from your Authenticator app</label>
        <hr style="width: 100%; border:1px solid #ffffff3b">
        <div class="div">
          <input type="text" index="0" name="" id="otp-1" maxLength="1" class="otp-inputs" autocomplete="-otp">
          <input type="text" index="1" name="" id="otp-2" maxLength="1" class="otp-inputs" autocomplete="-otp">
          <input type="text" index="2" name="" id="otp-3" maxLength="1" class="otp-inputs" autocomplete="-otp">
          <input type="text" index="3" name="" id="otp-4" maxLength="1" class="otp-inputs" autocomplete="-otp">
          <input type="text" index="4" name="" id="otp-5" maxLength="1" class="otp-inputs" autocomplete="-otp">
          <input type="text" index="5" name="" id="otp-6" maxLength="1" class="otp-inputs" autocomplete="-otp">
        </div>
        <div class="btn">
          <button id="confirm-tfa">Continue</button>
        </div>
      </form>
    </div>
    <div class="form-wrapper">
      <form action="/login" id="form" method="post">
        <div class="logo">
          <img src="/assets/images/logo-nbg.png" alt="">
        </div>
        <div class="name">
          <hr>
          <h2 class="3xl">Form<span style="color: rgb(173, 64, 250);">Bridge</span></h2>
          <hr>
        </div>
        <div class="div">
          <label for="username">Enter Username or Email</label>
          <div class="div-inp">
            <i class="fas fa-user-circle"></i>
            <input type="text" autocomplete="username" name="username" id="username" placeholder="Username">
          </div>
        </div>
        <div class="div">
          <label for="password">Enter Password</label>
          <div class="div-inp">
            <i class="fas fa-lock"></i>
            <input type="password" name="password" id="password" autocomplete="current-password" placeholder="Password">
            <div class="eye">
              <i class="fas fa-eye" style="color: rgb(224, 223, 223) !important;"></i>
            </div>
          </div>
        </div>
        <div class="actions">
          <button type="submit" id="lbtn">Login</button>
          <div class="reg">
            <hr>
            <a href="/register" style="color: #0f0;"> Register </a>
            <hr>
          </div>
          <a href="/" style="color: rgb(179, 0, 255);"> Home </a>
          <hr style="width: 100%;">

        </div>
      </form>
    </div>
    <style>
.cookieCard {
  width: 300px;
  height: 200px;
  background: linear-gradient(to right,rgb(137, 104, 255),rgb(175, 152, 255));
  display: none;
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;
  gap: 20px;
  padding: 20px;
  position: absolute;
  overflow: hidden;
}

.cookieCard::before {
  width: 150px;
  height: 150px;
  content: "";
  background: linear-gradient(to right,rgb(142, 110, 255),rgb(208, 195, 255));
  position: absolute;
  z-index: 1;
  border-radius: 50%;
  right: -25%;
  top: -25%;
}

.cookieHeading {
  font-size: 1.5em;
  font-weight: 600;
  color: rgb(241, 241, 241);
  z-index: 2;
}

.cookieDescription {
  font-size: 0.9em;
  color: rgb(241, 241, 241);
  z-index: 2;
}

.cookieDescription a {
  color: rgb(241, 241, 241);
}

.acceptButton {
  padding: 11px 20px;
  background-color: #7b57ff;
  transition-duration: .2s;
  border: none;
  color: rgb(241, 241, 241);
  cursor: pointer;
  font-weight: 600;
  z-index: 2;
}

.acceptButton:hover {
  background-color: #714aff;
  transition-duration: .2s;
}
    </style>

    <div class="cookieCard">
      <p class="cookieHeading">Cookies.</p>
      <p class="cookieDescription">By using this website you automatically accept that we use cookies. <a href="/cookies" style="color: rgb(12, 134, 128); text-decoration:underline">What for?</a></p>
      <button class="acceptButton">Understood</button>
    </div>
    

  </main>

  <script src="/assets/scripts/login.js"> </script>
</body>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const cookieCard = document.querySelector('.cookieCard');
    const acceptButton = document.querySelector('.acceptButton');
  
    if (document.cookie.split(';').some(item => item.trim().startsWith('acceptedCookies='))) {
      cookieCard.style.display = 'none';
    } else{
      cookieCard.style.display = 'flex'
    }
  
    acceptButton.addEventListener('click', () => {
      const expiry = new Date();
      expiry.setFullYear(expiry.getFullYear() + 1);
      document.cookie = `acceptedCookies=true; expires=${expiry.toUTCString()}; path=/`;
      cookieCard.style.display = 'none';
    });
  });
  </script>
  

</html>
