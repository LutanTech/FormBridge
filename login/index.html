<body class="bg-slate-950 min-h-screen flex flex-col text-slate-200 antialiased selection:bg-indigo-500 selection:text-white overflow-x-hidden">

    <!-- Background Elements -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none -z-10">
        <div class="absolute top-0 left-1/4 w-[500px] h-[500px] bg-indigo-600/10 rounded-full blur-[100px]"></div>
        <div class="absolute bottom-0 right-1/4 w-[500px] h-[500px] bg-purple-600/10 rounded-full blur-[100px] " style="animation-delay: 2s;"></div>
    </div>

    <style>
        main{
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .form-wrapper{
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.256);
            padding: 20px;
            border-radius: 20px;
            max-width: 400px;
            margin: 50px auto;
            width: 90%;
            height: fit-content;
        }
        form{
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .div-inp{
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;

        }
        .div{
            position: relative;
            display: flex;
            gap: 5px;
            flex-direction: column;
        }
        .div-inp input{
            display: flex;
            border-radius: 10px;
            padding: 10px;
            padding-left: 40px;
            flex-grow: 1;
            border: 0;
            outline: 2px solid indigo;
            font-size: small;
            min-width: 300px;
            color: black;
        }
        .div i:nth-of-type(1){
            position: absolute;
            left: 0px;
            color: rgb(84, 82, 82);
            padding: 10px;
        }
        .eye{
            position: absolute;
            right: 5px;
            width: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            cursor: pointer;
            height: 30px;
            &:active{
                scale: 0.97;
            }
            i{
                position: relative !important;
                color: rgb(15, 15, 15) !important;
                padding: 0 !important;
                left: 0 !important;
            }
        }
        h3, h2, h1{
            font-weight: bolder;
            text-align: center;
        }
        h2{
            font-size: 1.5em;
        }
        .logo{
            background: white;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            border-radius: 50%;
            justify-content: center;
            margin: auto;
            img{
                width: 100%;

            }
        }


        .actions{
            display: flex;
            gap: 20px;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        form button{
            background: green;
            border: 0px;
            padding: 10px 20px;
            flex-grow: 1;
            width: 80%;
            border-radius: 10px;

        }
        .name{
            display: flex;
            gap: 5px;
            justify-content: center;
            align-items: center;
            hr{
            flex-grow: 1;
            }
        }
        .reg{
            display: flex;
            width: 100%;
            margin-bottom: 5px;
            justify-content: center;
            align-items: center;
            gap: 10px;
            hr{
                flex-grow: 1;
                padding: 1px;

            }
        }
    </style>

    <main class="flex-grow flex flex-col">
        <div class="form-wrapper">
            <form action="/login" method="post">
                <div class="logo">
                    <img src="/assets/images/logo-nbg.png" alt="">
                </div>
                <div class="name"> <hr>
                <h2 class="3xl">Form<span style="color: rgb(173, 64, 250);">Bridge</span></h2> <hr></div>
                <div class="div">
                    <label for="username">Enter Username or Email</label>
                    <div class="div-inp">
                        <i class="fas fa-user-circle"></i>
                        <input type="text" autocomplete="username" name="username" id="username" placeholder="Username">
                    </div>
                </div>
                <div class="div">
                    <label for="password">Enter Password</label>
                    <div class="div-inp">
                        <i class="fas fa-lock"></i>
                        <input type="password" name="password" id="password" autocomplete="current-password" placeholder="Password">
                        <div class="eye">
                            <i class="fas fa-eye"></i>
                        </div>
                    </div>
                </div>
                <div class="actions">
                    <button type="submit">Login</button>
                    <div class="reg">
                        <hr> 
                    <a href="/register" style="color: #0f0;"> Register </a>
                    <hr>
                </div>
                <a href="/" style="color: rgb(179, 0, 255);"> Home </a>
                <hr style="width: 100%;">

                </div>
            </form>
        </div>

        </main>

    <script>
        document.addEventListener('DOMContentLoaded', ()=>{

        const eye = document.querySelector('.eye');
        const form = document.querySelector('form');
        const pass = form.querySelector('#password')

        eye.addEventListener('click', () => {
            eye.classList.toggle('closed')
            eye.classList.contains('closed') ? pass.setAttribute('type', 'text') :
            pass.setAttribute('type', 'password')

            if(eye.classList.contains('closed')){
            eye.innerHTML = '<i class="fas fa-eye-slash"></i>'
            } else{
            eye.innerHTML = '<i class="fas fa-eye"></i>'
            }

        });
        form.addEventListener('submit', (e)=>{
           e.preventDefault()
           e.stopImmediatePropagation()

           const username = form.querySelector('#username').value.trim()
           const password = form.querySelector('#password').value.trim()

           if(username && password){
            const payload = {
            username:username,
            password:password
            }
            login(jof(payload))
           }

        })
        function login(payload){
            toggleBtn(true)
            fetch(`http://127.0.0.1:6500/login`, {
                headers:{
                    'Content-Type':'application/json'
                },
                 method:'POST',
                 body:JSON.stringify({data:payload})
            })
            .then(res=>res.json())
            .then(data=>{
                if(data.error){
                    alert('Failed', data.error, 'error')
                    toggleBtn(false)
                } else{
                    if(data.user){
                        const exp = data.expiry || 1
                        setCookie('user', data.user , exp)
                        setCookie('token', data.token , exp)
                        setCookie('expiry', data.expiry , exp)
                        const user = jdf(data.user)
                        alert('Logged In', `Welcome ${user.username}. Redirecting...`, 'success')
                        toggleBtn(false)
                        setTimeout(()=>{window.location.href='/account'},2000 )
                    }
                }
            })
            .catch(err=>{
                alert('Network Error', 'Please Make sure you have an internet connection', 'error')
                toggleBtn(false)
            })
        
        }
        function toggleBtn(toggle){
                const btn = form.querySelector('button')
                btn.disabled = toggle
                toggle ? btn.setAttribute('data-loading', '') : btn.removeAttribute('data-loading', '')
                if(btn.hasAttribute('data-loading')){
                 btn.innerHTML = 'Login <i class="fas fa-spinner fa-spin"></i> '
                    } else{
                        btn.innerHTML = 'Login'
                    }
        }

})
    </script>
</body>
