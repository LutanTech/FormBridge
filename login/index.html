<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login || FormBridge</title>
  <meta name="title" content="FormBridge – Smart University Form Automation">
  <meta name="description" content="FormBridge simplifies form processing with fast, secure, digital tools for students and administrators. Create, submit, and track data effortlessly.">

  <link rel="canonical" href="https://formbridge.vercel.app/">
  <script src="https://cdn.tailwindcss.com"></script>

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://formbridge.vercel.app/">
  <meta property="og:title" content="FormBridge – Smart University Form Automation">
  <meta property="og:description" content="Fast, secure digital form management for universities.">
  <meta property="og:image" content="https://formbridge.vercel.app/assets/images/logo-nbg.png">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://formbridge.vercel.app/">
  <meta name="twitter:title" content="FormBridge – The ultimate Simplifier">
  <meta name="twitter:description" content="Digital form management built for universities.">
  <meta name="twitter:image" content="https://formbridge.vercel.app/assets/images/logo-nbg.png">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "FormBridge",
    "alternateName": "Form Bridge Platform",
    "url": "https://formbridge.vercel.app/",
    "logo": "https://formbridge.vercel.app/assets/images/logo-nbg.png",
    "sameAs": []
  }

  </script>

  <meta name="keywords" content="university forms, Moi University formbridge, digital forms, student portal tools, form submission system, lutan tech projects, formbridge, formbridge kenya, form automations, formbridge">
  <meta name="robots" content="index, follow">
  <link rel="shortcut icon" href="/assets/logo.png" type="image/x-icon">
  <link rel="icon" href="/assets/logo.png" type="image/x-icon">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="/assets/scripts/utils.js" defer></script>
  <link rel="stylesheet" href="/assets/css/utils.css">
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="/assets/css/login.css">
  <script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        fontFamily: {
          sans: ['Inter', 'sans-serif'],
        },
        colors: {
          slate: {
            850: '#151e2e',
            950: '#020617',
          }
        }
      }
    }
  }

  </script>
</head>

<body class="bg-slate-950 min-h-screen flex flex-col text-slate-200 antialiased selection:bg-indigo-500 selection:text-white overflow-x-hidden">

  <!-- Background Elements -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none -z-10">
    <div class="absolute top-0 left-1/4 w-[500px] h-[500px] bg-indigo-600/10 rounded-full blur-[100px]"></div>
    <div class="absolute bottom-0 right-1/4 w-[500px] h-[500px] bg-purple-600/10 rounded-full blur-[100px] " style="animation-delay: 2s;"></div>
  </div>

  <main class="flex-grow flex flex-col">
    <div class="otpField none">
      <form id="tfaform" action="/post">
        <label for="tfa">Enter the 2FA code from your Authenticator app</label>
        <hr style="width: 100%; border:1px solid #ffffff3b">
        <div class="div">
          <input type="text" index="0" name="" id="otp-1" maxLength="1" class="otp-inputs" autocomplete="-otp">
          <input type="text" index="1" name="" id="otp-2" maxLength="1" class="otp-inputs" autocomplete="-otp">
          <input type="text" index="2" name="" id="otp-3" maxLength="1" class="otp-inputs" autocomplete="-otp">
          <input type="text" index="3" name="" id="otp-4" maxLength="1" class="otp-inputs" autocomplete="-otp">
          <input type="text" index="4" name="" id="otp-5" maxLength="1" class="otp-inputs" autocomplete="-otp">
          <input type="text" index="5" name="" id="otp-6" maxLength="1" class="otp-inputs" autocomplete="-otp">
        </div>
        <div class="btn">
          <button id="confirm-tfa">Continue</button>
        </div>
      </form>
    </div>
    <div class="form-wrapper">
      <form action="/login" id="form" method="post">
        <div class="logo">
          <img src="/assets/images/logo-nbg.png" alt="">
        </div>
        <div class="name">
          <hr>
          <h2 class="3xl">Form<span style="color: rgb(173, 64, 250);">Bridge</span></h2>
          <hr>
        </div>
        <div class="div">
          <label for="username">Enter Username or Email</label>
          <div class="div-inp">
            <i class="fas fa-user-circle"></i>
            <input type="text" autocomplete="username" name="username" id="username" placeholder="Username">
          </div>
        </div>
        <div class="div">
          <label for="password">Enter Password</label>
          <div class="div-inp">
            <i class="fas fa-lock"></i>
            <input type="password" name="password" id="password" autocomplete="current-password" placeholder="Password">
            <div class="eye">
              <i class="fas fa-eye" style="color: rgb(224, 223, 223) !important;"></i>
            </div>
          </div>
        </div>
        <div class="actions">
          <button type="submit" id="lbtn">Login</button>
          <div class="reg">
            <hr>
            <a href="/register" style="color: #0f0;"> Register </a>
            <hr>
          </div>
          <a href="/" style="color: rgb(179, 0, 255);"> Home </a>
          <hr style="width: 100%;">

        </div>
      </form>
    </div>

  </main>

  <script src="/assets/scripts/login.js"> </script>
</body>

</html>
