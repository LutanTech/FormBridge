<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progressive Download Manager</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --success-color: #10b981;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-secondary: #6b7280;
            --border-color: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 24px;
            border-bottom: 1px solid var(--border-color);
            background-color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .controls {
            padding: 20px 24px;
            background-color: #f9fafb;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: flex-end;
        }

        button#start-download {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 0.95rem;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }

        button#start-download:hover:not(:disabled) {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        button#start-download:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            background-color: var(--text-secondary);
        }

        #status-container {
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .download-item {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            background-color: #fff;
            transition: box-shadow 0.2s ease;
        }

        .download-item:hover {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border-color: #d1d5db;
        }

        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .status-text {
            font-size: 0.9rem;
            color: var(--text-main);
        }

        .status-text strong {
            color: var(--primary-color);
        }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background-color: #e5e7eb;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--success-color);
            width: 0%;
            border-radius: 4px;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        /* Optional stripe animation for active progress */
        .progress-bar.active {
            background-image: linear-gradient(
                45deg, 
                rgba(255,255,255,.15) 25%, 
                transparent 25%, 
                transparent 50%, 
                rgba(255,255,255,.15) 50%, 
                rgba(255,255,255,.15) 75%, 
                transparent 75%, 
                transparent
            );
            background-size: 1rem 1rem;
            animation: progress-stripes 1s linear infinite;
        }

        @keyframes progress-stripes {
            from { background-position: 1rem 0; }
            to { background-position: 0 0; }
        }

        /* Scrollbar styling for the main page */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #c1c1c1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8; 
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>📄 Batch PDF Downloader</h1>
        </div>
        
        <div class="controls">
            <button id="start-download">Start Downloads</button>
        </div>

        <div id="status-container">
            </div>
    </div>

    <script>
        const prefixes = ['LMC', 'BA', 'KIS', 'BAE', 'PSS', 'PSY', 'CP', 'CD', 'SWK', 'PSA', 'GEO', 'FRE', 'GER'];
        const baseUrl = 'https://submissionsmu.pythonanywhere.com/download-sas-pdf';
        const statusContainer = document.getElementById('status-container');
        const startButton = document.getElementById('start-download');

        const createDownloadItem = (prefix) => {
            const item = document.createElement('div');
            item.className = 'download-item';
            item.id = `item-${prefix}`;
            
            item.innerHTML = `
                <div class="status-header">
                    <span class="status-text" id="status-text-${prefix}">Waiting: <strong>${prefix}</strong></span>
                    <span style="font-size:0.8rem; color:#6b7280" id="percent-text-${prefix}">0%</span>
                </div>
                <div class="progress-bar-container">
                    <div class="progress-bar" id="progress-${prefix}" style="width: 0%"></div>
                </div>
            `;
            statusContainer.appendChild(item);
        };

        const updateProgress = (prefix, percent, statusText) => {
            const progressBar = document.getElementById(`progress-${prefix}`);
            const statusDiv = document.getElementById(`status-text-${prefix}`);
            const percentText = document.getElementById(`percent-text-${prefix}`);

            if (progressBar) {
                progressBar.style.width = `${percent}%`;
                
                if (percent > 0 && percent < 100) {
                    progressBar.classList.add('active');
                } else {
                    progressBar.classList.remove('active');
                }
                
                if (percent === 100) {
                    progressBar.style.backgroundColor = '#2563eb'; 
                }
            }

            if (percentText) {
                percentText.textContent = `${Math.round(percent)}%`;
            }

            if (statusDiv && statusText) {
                statusDiv.innerHTML = statusText;
            }
        };

        const downloadFile = async (prefix) => {
            const url = `${baseUrl}?prefix=${prefix}`;
            const filename = `${prefix}_SAS401_student_details.pdf`;

            try {
                updateProgress(prefix, 0, `Downloading <strong>${filename}</strong>...`);

                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }

                const contentLength = response.headers.get('content-length');
                const total = contentLength ? parseInt(contentLength, 10) : 0;
                
                const reader = response.body.getReader();
                let receivedLength = 0;
                let chunks = [];

                while(true) {
                    const { done, value } = await reader.read();

                    if (done) {
                        break;
                    }

                    chunks.push(value);
                    receivedLength += value.length;

                    if (total > 0) {
                        const percent = (receivedLength / total) * 100;
                        updateProgress(prefix, percent, `Downloading... (${(receivedLength/1024).toFixed(1)} KB / ${(total/1024).toFixed(1)} KB)`);
                    } else {
                        updateProgress(prefix, receivedLength % 100, `Downloading... (${(receivedLength/1024).toFixed(1)} KB)`);
                    }
                }

                const blob = new Blob(chunks, { type: 'application/pdf' });
                const downloadUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = downloadUrl;
                a.download = filename; 
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(downloadUrl);

                updateProgress(prefix, 100, `✅ Complete: <strong>${filename}</strong>`);
                return true;

            } catch (error) {
                updateProgress(prefix, 0, `❌ Error: ${error.message}`);
                console.error(`Download failed for ${prefix}:`, error);
                return false;
            }
        };

        const startProgressiveDownloads = async () => {
            startButton.disabled = true;
            startButton.textContent = 'Downloading...';
            

            for (const prefix of prefixes) {
                await downloadFile(prefix); 
            }
            startButton.disabled = false;
            startButton.textContent = 'All Downloads Finished';
        };

        document.addEventListener('DOMContentLoaded', () => {
            startButton.addEventListener('click', startProgressiveDownloads);
            prefixes.forEach(p => createDownloadItem(p)); 
            startButton.textContent = `Start Downloads (${prefixes.length} files)`;
        });
    </script>
</body>
</html>
